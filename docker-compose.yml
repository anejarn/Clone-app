# Local Postgres matching .env.example. `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sigma
      POSTGRES_PASSWORD: sigma
      POSTGRES_DB: sigma
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigma"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
